<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Circuit Breakers ATR72</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: cover page unchanged on top, then a sticky search/filter bar over a panel-grouped breaker list (row grid on desktop, stacked on phone). */
:root{
  --bg:#eceef1; --surface:#ffffff; --surface-2:#f3f4f6; --fg:#16202b; --muted:#5d6b7a; --line:#d9dde3;
  --accent:#f6d443; --accent-ink:#1b1600; --sect:#ee7a2a; --sect-ink:#ffffff; --vu:#d4262c; --mark:#fff0a0; --focus:#1c5fd4;
  --shadow:0 1px 2px rgba(22,32,43,.06),0 8px 24px rgba(22,32,43,.06);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#171f28; --surface-2:#1e2833; --fg:#e8edf2; --muted:#92a1b1; --line:#2a3644;
  --accent:#f6d443; --accent-ink:#1b1600; --sect:#e8742a; --sect-ink:#ffffff; --vu:#ff6b6f; --mark:#5c4d00; --focus:#7fb0ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#171f28; --surface-2:#1e2833; --fg:#e8edf2; --muted:#92a1b1; --line:#2a3644;
  --accent:#f6d443; --accent-ink:#1b1600; --sect:#e8742a; --sect-ink:#ffffff; --vu:#ff6b6f; --mark:#5c4d00; --focus:#7fb0ff;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
.wrap{max-width:1040px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* cover: the original first page, shown untouched */
.cover{padding-block:24px 8px}
.cover img{display:block;width:100%;max-width:760px;margin:0 auto;height:auto;box-shadow:var(--shadow)}
.cover-cta{display:flex;justify-content:center;padding-top:14px}
.cover-cta a{font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--fg);border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:6px}
.cover-cta a:hover{border-color:var(--fg)}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.bar-in{display:flex;flex-direction:column;gap:10px;padding-block:12px}
.row1{display:flex;gap:10px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;height:44px;padding:0 74px 0 40px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);font:500 16px var(--f-body)}
.search input::placeholder{color:var(--muted);font-weight:400}
.search input:focus{outline:none;border-color:var(--focus);background:var(--surface)}
.search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:500 11px var(--f-mono);color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:var(--line);color:var(--fg);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:16px;line-height:1}
.theme{height:44px;width:44px;flex:none;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;cursor:pointer;display:grid;place-items:center}
.theme svg{width:18px;height:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chips-label{flex:none;font:600 11px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);align-self:center;padding-right:2px}
.chip{flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:999px;padding:5px 12px;font:500 13px var(--f-mono);cursor:pointer;white-space:nowrap}
.chip small{font:inherit;color:var(--muted);margin-left:5px}
.chip:hover{border-color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:var(--accent-ink);opacity:.7}
.letters .chip{padding:4px 0;min-width:32px;text-align:center;font-family:var(--f-display);font-weight:600;font-size:16px}
.chip:focus-visible,.theme:focus-visible,.search button:focus-visible,.cover-cta a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.status{display:flex;justify-content:space-between;gap:12px;font-size:13px;color:var(--muted);padding-block:14px 8px}
.status b{color:var(--fg);font-variant-numeric:tabular-nums}
.status button{border:0;background:none;color:var(--focus);font:500 13px var(--f-body);cursor:pointer;padding:0}

/* list */
main{padding-bottom:56px}
.sect{margin-top:18px}
.sect-h{display:flex;align-items:center;gap:12px;background:var(--sect);color:var(--sect-ink);border-radius:8px 8px 0 0;padding:4px 16px}
.sect-h span{font:700 34px/1 var(--f-display);letter-spacing:.02em}
.sect-h em{font:500 12px var(--f-body);font-style:normal;opacity:.9;margin-left:auto;letter-spacing:.04em}
.table{background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;overflow:hidden}
.head,.r{display:grid;grid-template-columns:minmax(0,1fr) 72px 96px 88px;column-gap:12px;align-items:center;padding:9px 16px}
.head{background:var(--accent);color:var(--accent-ink);font:700 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding-block:5px}
.r{border-top:1px solid var(--line)}
.r:nth-child(odd){background:var(--surface-2)}
.r:hover{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.a{font-weight:500;overflow-wrap:anywhere}
.vu{font:600 14px var(--f-mono);color:var(--vu);font-variant-numeric:tabular-nums}
.fin,.pos{font:500 14px var(--f-mono)}
.pos{font-weight:600}
.lab{display:none}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{padding:56px 16px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:8px;margin-top:18px}
.empty b{display:block;font:600 22px var(--f-display);color:var(--fg);letter-spacing:.02em;margin-bottom:4px}
footer{padding-block:0 40px;color:var(--muted);font-size:12px;text-align:center}

.filters{display:flex;flex-direction:column;gap:10px}
.fbtn{display:none;position:relative;height:44px;flex:none;align-items:center;gap:7px;padding:0 12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;cursor:pointer;font:600 14px var(--f-body)}
.fbtn svg{width:18px;height:18px}
.fbtn[aria-expanded="true"]{border-color:var(--focus);background:var(--surface)}
.fbtn b{min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 12px/20px var(--f-mono);text-align:center}
.fbtn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* phone: only the search row stays on screen; filters open on demand, rows get larger text and touch targets */
@media (max-width:640px){
  .cover{padding-block:12px 4px}
  .cover-cta{padding-top:10px}
  .bar-in{gap:8px;padding-block:8px}
  .row1{gap:8px}
  .fbtn{display:inline-flex}
  .filters{display:none;max-height:320px;max-height:min(46dvh,320px);overflow-y:auto;overscroll-behavior:contain;padding-bottom:4px}
  .filters.open{display:flex}
  .chips{flex-wrap:wrap;overflow:visible;gap:8px}
  .chips-label{flex-basis:100%;padding:0}
  .chip{padding:8px 14px;font-size:14px;min-height:38px}
  .letters .chip{min-width:44px;padding:6px 0;font-size:18px}
  .status{padding-block:10px 4px;font-size:14px}
  .status button{padding:8px 0;font-size:14px}
  .sect{margin-top:14px}
  .sect-h{padding:3px 14px}
  .sect-h span{font-size:26px}
  .head{display:none}
  .r{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr);gap:8px 12px;padding:12px 14px}
  .a{grid-column:1/-1;font-size:16px;line-height:1.35}
  .lab{display:block;font:600 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
  .vu,.fin,.pos{font-size:15px}
  .search kbd{display:none}
  .search input{padding-right:44px}
}
@media (prefers-reduced-motion:no-preference){.r{transition:background .12s}}
</style>

const $ = id => document.getElementById(id);
const state = {q:"", vu:"", sect:""};
const VUS = [...new Set(DATA.map(r=>r.vu))].sort((a,b)=>a-b);
const SECTS = [...new Set(DATA.map(r=>r.s))];
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");

function chip(label, count, key, val){
  const b = document.createElement("button");
  b.type="button"; b.className="chip"; b.dataset.key=key; b.dataset.val=val;
  b.setAttribute("aria-pressed","false");
  b.innerHTML = count==null ? label : label+"<small>"+count+"</small>";
  return b;
}
function buildChips(){
  const vc=$("vuChips"), lc=$("letterChips");
  vc.append(chip("Semua",null,"vu",""));
  VUS.forEach(v=>vc.append(chip(v+" VU",DATA.filter(r=>r.vu===v).length,"vu",v)));
  lc.append(chip("Semua",null,"sect",""));
  SECTS.forEach(s=>lc.append(chip(s,null,"sect",s)));
  [vc,lc].forEach(box=>box.addEventListener("click",e=>{
    const b=e.target.closest(".chip"); if(!b) return;
    state[b.dataset.key]=b.dataset.val; render(); if(mqPhone.matches) setFilters(false); scrollToBar();
  }));
}
const mqPhone = matchMedia("(max-width:640px)");
function setFilters(open){
  $("filters").classList.toggle("open", open);
  $("fbtn").setAttribute("aria-expanded", String(open));
}
function scrollToBar(){
  const top=$("cari").getBoundingClientRect().top;
  if(top>1) $("cari").scrollIntoView({block:"start"});
}
function match(r, terms){
  if(!terms.length) return true;
  const hay=(r.a+" "+r.fin+" "+r.pos+" "+r.vu).toLowerCase();
  return terms.every(t=>hay.includes(t));
}
function render(){
  const terms=state.q.toLowerCase().split(/\s+/).filter(Boolean);
  const rows=DATA.filter(r=>(!state.vu||r.vu===state.vu)&&(!state.sect||r.s===state.sect)&&match(r,terms));
  const hl = terms.length ? new RegExp("("+terms.map(reEsc).join("|")+")","gi") : null;
  const mk = s => { const e=esc(s); return hl? e.replace(hl,"<mark>$1</mark>") : e; };
  const groups={};
  rows.forEach(r=>(groups[r.s]=groups[r.s]||[]).push(r));
  let html="";
  SECTS.filter(s=>groups[s]).forEach(s=>{
    html+='<section class="sect" id="sec-'+s+'"><div class="sect-h"><span>'+s+'</span><em>'+groups[s].length+' item</em></div><div class="table"><div class="head"><div>Acronyms</div><div>VU</div><div>FIN</div><div>Position</div></div>';
    groups[s].forEach(r=>{
      html+='<div class="r"><div class="a">'+mk(r.a)+'</div><div><span class="lab">VU</span><span class="vu">'+mk(r.vu)+'</span></div><div><span class="lab">FIN</span><span class="fin">'+mk(r.fin)+'</span></div><div><span class="lab">Position</span><span class="pos">'+mk(r.pos)+'</span></div></div>';
    });
    html+='</div></section>';
  });
  if(!rows.length) html='<div class="empty"><b>Tidak ada hasil</b>Coba kata lain, kurangi filter, atau cari dengan kode FIN atau posisi.</div>';
  $("list").innerHTML=html;
  const filtered = !!(state.q||state.vu||state.sect);
  $("count").innerHTML="Menampilkan <b>"+rows.length+"</b> dari <b>"+DATA.length+"</b> circuit breaker";
  $("reset").hidden=!filtered;
  const nf=(state.vu?1:0)+(state.sect?1:0);
  $("fcount").hidden=!nf; $("fcount").textContent=nf;
  $("clear").hidden=!state.q;
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed",String(state[b.dataset.key]===b.dataset.val)));
}
$("q").addEventListener("input",e=>{state.q=e.target.value;render();});
$("q").addEventListener("keydown",e=>{if(e.key==="Enter") e.target.blur();});
$("fbtn").addEventListener("click",()=>setFilters(!$("filters").classList.contains("open")));
$("clear").addEventListener("click",()=>{$("q").value="";state.q="";render();$("q").focus();});
$("reset").addEventListener("click",()=>{$("q").value="";state.q="";state.vu="";state.sect="";render();});
document.addEventListener("keydown",e=>{
  const t=e.target.tagName;
  if(e.key==="/" && t!=="INPUT" && t!=="TEXTAREA"){e.preventDefault();$("q").focus();scrollToBar();}
  if(e.key==="Escape" && document.activeElement===$("q")){ if(state.q){$("q").value="";state.q="";render();} else $("q").blur(); }
});
$("theme").addEventListener("click",()=>{
  const root=document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
});
buildChips(); render();
</script>
